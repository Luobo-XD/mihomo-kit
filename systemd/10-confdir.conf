[Service]
# 必须先清空再重设，否则 drop-in 不生效（见 docs/troubleshooting.md）
# %h = 该单元 User= 指定的用户主目录（此处 mihomo@<user> 的 <user>），
#      故不再硬编码 /home/<user>。若 mihomo 不在 /usr/bin，改下一行。
ExecStart=
ExecStart=/usr/bin/mihomo -d %h/ConfMihomo/config

# 发行版单元 mihomo@.service 里写死了 LimitNPROC=500，但 Linux 的 RLIMIT_NPROC
# 统计的是"线程数"（同一 UID 的所有任务）。桌面会话下当前用户的线程数常超过 500，
# 导致 systemd 在 execve 阶段报 203/EXEC "Resource temporarily unavailable"。
# 这里覆盖为无限制，避免服务因会话负载而无法启动。
LimitNPROC=infinity
