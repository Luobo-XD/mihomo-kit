[Service]
# 必须先清空再重设，否则 drop-in 不生效（README §10 坑 10）
ExecStart=
ExecStart=/usr/bin/mihomo -d /home/Luo_bo/ConfMihomo/config

# 发行版单元 mihomo@.service 里写死了 LimitNPROC=500，但 Linux 的 RLIMIT_NPROC
# 统计的是"线程数"（同一 UID 的所有任务）。桌面会话下 Luo_bo 的线程数常超过 500，
# 导致 systemd 在 execve 阶段报 203/EXEC "Resource temporarily unavailable"。
# 这里覆盖为无限制，避免服务因会话负载而无法启动。
LimitNPROC=infinity
